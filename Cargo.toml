[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/ledger",
    "crates/provider-bigbang",
    "crates/provider-stripe",
    "crates/provider-sports",
    "crates/api",
    "services/mock-sportsbook",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
domain = { path = "crates/domain" }
ledger = { path = "crates/ledger" }
provider-bigbang = { path = "crates/provider-bigbang" }
provider-stripe = { path = "crates/provider-stripe" }
provider-sports = { path = "crates/provider-sports" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "json"] }
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
